rules:
  template-injection:
    ignore:
      # matrix.pixi-environment is a static string literal from this
      # workflow's own hard-coded matrix (see the `include:` list above the
      # `checks` job), not attacker-controlled input, so there is no
      # injection risk here. The usual env-var fix is skipped because this
      # step runs on ubuntu-latest, windows-latest, and macos-14, and their
      # default shells (bash vs pwsh) use different environment-variable
      # syntax, which would break the Windows and macOS runs.
      - ci.yml:120
