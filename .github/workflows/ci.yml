name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.70.2
          cache: true
          cache-key: dev
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: dev

      - name: Run pre-commit
        run: pixi run pre-commit --hook-stage manual

      - name: Run PyLint
        run: pixi run pylint --output-format=github

  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.70.2
          cache: true
          cache-key: dev-${{ github.ref_name }}
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: dev

      - name: Build and check package
        run: pixi run build-check

  checks:
    name:
      Check Python ${{ matrix.python-version }} (${{ matrix.variant }}) on ${{
      matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit]
    permissions:
      contents: read # checkout the repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        runs-on: [ubuntu-latest, windows-latest, macos-14]
        variant: [default]
        include:
          # Default
          - python-version: "3.12"
            variant: default
            pixi-environment: py312
          - python-version: "3.13"
            variant: default
            pixi-environment: py313
          - python-version: "3.14"
            variant: default
            pixi-environment: py314

          # JAX
          - python-version: "3.14"
            runs-on: ubuntu-latest
            variant: jax
            pixi-environment: py314-jax

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.70.2
          cache: true
          cache-key: ${{ matrix.pixi-environment }}-${{ github.ref_name }}
          cache-write:
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: ${{ matrix.pixi-environment }}

      - name: Test package
        run: >-
          pixi run -e ${{ matrix.pixi-environment }} test-all -ra --cov-branch
          --cov-report=xml --cov-report=term --junitxml=junit.xml -o
          junit_family=legacy --durations=20

      - name: Test docs
        if: matrix.variant == 'jax'
        env:
          JAX_PLATFORMS: "cpu" # for jax-related tests
          PIXI_ENVIRONMENT: ${{ matrix.pixi-environment }}
        run: |
          pixi run -e "$PIXI_ENVIRONMENT" test-docs
          pixi run -e "$PIXI_ENVIRONMENT" test-docstrings

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
